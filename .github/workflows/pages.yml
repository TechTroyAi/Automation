# Deploy the static portfolio to GitHub Pages.
# The github-pages environment only allows the `main` branch, so:
#   - pull requests  → verify the site files (this check)
#   - push to main   → build + deploy to techtroyai.github.io/Automation
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify site files
        run: |
          set -e
          test -f index.html
          test -f 404.html
          test -f favicon.png
          test -f og.jpg
          grep -q '<title>' index.html
          echo "Site files look good."

      - name: Prepare site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp index.html 404.html _site/
          cp favicon.png og.jpg _site/
          # Skip Jekyll so GitHub Pages serves files as-is
          touch _site/.nojekyll

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
